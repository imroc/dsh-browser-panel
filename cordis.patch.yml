# Bundle patch for dsh-browser-panel: inserts the dual-face plugin row into the
# profile roster. The node half (exports ".") runs in the DSH host process
# (browser lifecycle, /api/dsh-browser-panel routes, agent tools) and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client") load in the Web GUI.
#
# Override any field of the plugin config from your own patch layer, e.g.
#   - id: browser-panel
#     config:
#       mode: headless
#       idleShutdownMinutes: 15
- insert:
    - id: browser-panel
      name: 'dsh-browser-panel'
